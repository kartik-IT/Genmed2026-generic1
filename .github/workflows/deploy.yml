name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options: [staging, production]

jobs:
  deploy:
    name: Deploy (${{ github.event.inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Authenticate to container registry ──────────────────────
      # Uncomment and configure the registry step that matches your deployment target.
      # Example: Google Artifact Registry
      # - name: Authenticate to Google Cloud
      #   uses: google-github-actions/auth@v2
      #   with:
      #     credentials_json: ${{ secrets.GCP_SA_KEY }}
      #
      # - name: Configure Docker for Artifact Registry
      #   run: gcloud auth configure-docker us-central1-docker.pkg.dev

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          # push: true  # Uncomment once registry is configured
          push: false
          tags: |
            lowbest-api:${{ github.sha }}
            lowbest-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Deploy to Cloud Run ─────────────────────────────────────
      # - name: Deploy to Cloud Run
      #   run: |
      #     gcloud run deploy lowbest-api \
      #       --image us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT }}/lowbest/api:${{ github.sha }} \
      #       --region us-central1 \
      #       --platform managed \
      #       --allow-unauthenticated \
      #       --set-env-vars "NODE_ENV=production,APP_URL=${{ secrets.APP_URL }}" \
      #       --set-secrets "GEMINI_API_KEY=GEMINI_API_KEY:latest"

      - name: Deployment summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** ${{ github.event.inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **SHA:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Time:** $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> ⚠️ Registry push and Cloud Run deploy steps are commented out." >> $GITHUB_STEP_SUMMARY
          echo "> Configure your registry and uncomment those steps to enable live deploys." >> $GITHUB_STEP_SUMMARY
